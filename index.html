<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>한영 노래책</title>
<style>
body{font-family:Arial,sans-serif;background:#121212;color:#fff;max-width:900px;margin:auto;padding:20px}
h1{color:#ff6ec7}
input{width:100%;padding:12px;font-size:16px;border-radius:8px;border:1px solid #555}
table{width:100%;border-collapse:collapse;margin-top:20px}
th,td{padding:10px;border-bottom:1px solid #333}
th{background:#222}
tr:hover{background:#1f1f1f}
small{color:#bbb}
</style>
</head>
<body>
<h1>🎤 한영 노래책</h1>
<p>검색창에 가수 또는 노래 제목을 입력하세요.</p>
<input id="search" placeholder="예: 박효신 / 야생화">
<table id="songs">
<thead><tr><th>가수</th><th>노래</th><th>장르</th></tr></thead>
<tbody>
<tr><td>박효신</td><td>야생화</td><td>발라드</td></tr>
<tr><td>김범수</td><td>보고싶다</td><td>발라드</td></tr>
<tr><td>성시경</td><td>거리에서</td><td>발라드</td></tr>
<tr><td>YB</td><td>나는 나비</td><td>락</td></tr>
<tr><td>버즈</td><td>가시</td><td>락</td></tr>
<tr><td>임영웅</td><td>이제 나만 믿어요</td><td>트로트</td></tr>
<tr><td>NewJeans</td><td>Hype Boy</td><td>K-POP</td></tr>
<tr><td>IVE</td><td>I AM</td><td>K-POP</td></tr>
</tbody>
</table>
<p><small>신청은 채팅에 "닉네임 / 가수 / 노래" 형식으로 보내주세요.</small></p>
<script>
const s=document.getElementById('search');
s.onkeyup=()=>{
 const f=s.value.toLowerCase();
 document.querySelectorAll('#songs tbody tr').forEach(r=>{
   r.style.display=r.innerText.toLowerCase().includes(f)?'':'none';
 });
}
</script>
</body>
</html>
